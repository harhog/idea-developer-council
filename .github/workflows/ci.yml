name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Memory engine tests
        run: python tests/test_council_memory.py
      - name: Knowledge builder tests
        run: python tests/test_member_knowledge.py
      - name: Council pipeline tests
        run: python tests/test_council.py
      - name: Validate knowledge registry
        run: python scripts/member_knowledge.py
      - name: Import check
        run: python -c "from app.main import app; print('app ok', app.title)"
